{# Set-up's shared pieces, for the pages under cs/crm/setup/ (import them "with context":
   they read PRODUCTS from the page). #}
{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>{% endmacro %}
{% macro product_select(name, value) -%}
<select name="{{ name }}">{% for code, label in PRODUCTS.items() %}<option value="{{ code }}"{{ ' selected' if value == code }}>{{ label }}</option>{% endfor %}</select>
{%- endmacro %}
