{% if not availability.ok %}
<div class="verify-banner" style="border-radius:10px;margin-bottom:16px;border:1px solid #fde68a">
  <i class="fa-solid fa-triangle-exclamation"></i>
  <span><strong>Scraping cannot run on this server.</strong> {{ availability.message }} You can still review rows scraped earlier, create posts from them and export them.</span>
</div>
{% elif availability.warning %}
<div class="verify-banner" style="border-radius:10px;margin-bottom:16px;border:1px solid #fde68a">
  <i class="fa-solid fa-circle-info"></i> <span>{{ availability.warning }}</span>
</div>
{% endif %}
