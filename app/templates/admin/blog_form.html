{% extends 'base.html' %}
{% block title %}New Blog Post – Admin{% endblock %}
{% block content %}
<div class="admin-page">
  {% with active='blog' %}{% include 'admin/_sidebar.html' %}{% endwith %}
  <main class="admin-main">
    <h1>New Blog Post</h1>
    <form method="POST" class="admin-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="field-group">
        <label>Title *</label>
        <input type="text" name="title" required placeholder="Blog post title"/>
      </div>
      <div class="field-group">
        <label>Content * <small>(HTML allowed)</small></label>
        <textarea name="content" rows="12" required placeholder="Write your blog post..."></textarea>
      </div>
      <label class="flex-check"><input type="checkbox" name="is_published"/> Publish immediately</label>
      <label class="flex-check"><input type="checkbox" name="send_notification" checked/> Notify all users in-app (e-mail only to those who opted in)</label>
      <button type="submit" class="btn btn-primary mt-2">Save Post</button>
    </form>
  </main>
</div>
{% endblock %}
